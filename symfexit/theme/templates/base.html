{% load static current_theme %}
<!DOCTYPE html>
<html lang="nl">
  <head>
    <title>{% block title %}{{ config.SITE_TITLE }}{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% theme_css_file %}
    {% preload_css_file %}
    <link rel="icon" type="image/png" href="{% if config.FAVICON %}{% get_media_prefix %}{{ config.FAVICON }}{% else %}{static 'img/favicon.ico'}{% endif %}">
    <link rel="apple-touch-icon" href="{% if config.FAVICON %}{% get_media_prefix %}{{ config.FAVICON }}{% else %}{static 'img/favicon.ico'}{% endif %}">
    <link href="{% static 'fontawesomefree/css/fontawesome.css' %}" rel="stylesheet" type="text/css">
    <link href="{% static 'fontawesomefree/css/regular.css' %}" rel="stylesheet" type="text/css">
    <link href="{% static 'fontawesomefree/css/solid.css' %}" rel="stylesheet" type="text/css">
    {% block css %}{% endblock css %}
  </head>

  <body>
    {% block body %}{% endblock body %}
    {% block scripts %}{% endblock scripts %}
  </body>
</html>
